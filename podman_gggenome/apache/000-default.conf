<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/html
    SetEnv PERL5LIB /var/www/html
    Header append Access-Control-Allow-Origin "*"

    DirectoryIndex index.pl index.cgi index.html
    AddLanguage en .en
    AddLanguage ja .ja
    LanguagePriority en ja
    ForceLanguagePriority Prefer Fallback

    <Directory /var/www/html>
        Options ExecCGI FollowSymLinks MultiViews
        AllowOverride None
        Require all granted
        AddHandler cgi-script .cgi .pl
    </Directory>

    RewriteEngine On

    RewriteRule ^/dev/ - [L]
    RewriteRule ^/static/ - [L]
    RewriteCond %{REQUEST_URI} ^/((test|bitst)/)?
    RewriteRule (?:^|/)(static/.*)$ /%1$1 [L]

    RewriteRule ^/[^/]*\.(png|svg)$ - [L]
    RewriteCond %{REQUEST_URI} ^/((test|bitst)/)?
    RewriteRule (?:^|/)([^/]*\.(png|svg))$ /%1$1 [L]

    RewriteRule ^/api\.txt$ - [L]
    RewriteCond %{REQUEST_URI} ^/((test|bitst)/)?
    RewriteRule (?:^|/)(api)?\.txt$ /%1api.txt [L]

    RewriteRule ^/help\.html(\.en|\.ja)?$ - [L]
    RewriteRule ^/(?:debug/)?(?:(en|ja)/)(?:(?!en/|ja/)[-\w\.]+/)?(?:\d+/)?(?:(?:\+|\-)/)?(?:nogap/)?help\.html(\.en|\.ja)?$ /help.html.$1 [L]
    RewriteRule ^/(?:debug/)?(?:[-\w\.]+/)?(?:\d+/)?(?:(?:\+|\-)/)?(?:nogap/)?help\.html(\.en|\.ja)?$ /help.html$1 [L]

    RewriteRule ^/index\.pl - [L]
    RewriteCond %{REQUEST_URI} ^/((test|bitst)/)?
    RewriteRule .* /%1index.pl [L]

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
